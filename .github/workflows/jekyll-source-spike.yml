name: Validate Jekyll source
on:
  push:
    branches: [codex/ant-424-articles-activities-cms]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install synthetic build-only fixtures
        run: |
          for collection in articles_en articles_zh activities_en activities_zh; do
            cp "tests/fixtures/editorial/$collection.md" "_$collection/sample.md"
          done
          cp icons/apple-touch-icon.png media/images/example.png
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
      - name: Assert generated pages and protected assets
        run: python tests/assert_jekyll_output.py
      - name: Save non-public CI test output
        uses: actions/upload-artifact@v4
        with:
          name: ant424-fixture-site
          path: _site
          retention-days: 3
