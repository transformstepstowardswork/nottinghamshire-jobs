name: Validate site source PR

on:
  pull_request:
    branches:
      - main
    paths:
      - app.js
      - index.html
      - support.html
      - locale.js
      - activities.js
      - articles.js
      - styles.css
      - _config.yml
      - _layouts/**
      - _includes/**
      - _articles_*/**
      - _activities_*/**
      - articles/**
      - activities/**
      - media/**
      - .pages.yml
      - README.md
      - EDITOR_GUIDE.md
      - scripts/**
      - tests/**
      - .github/workflows/validate-source-pr.yml

permissions:
  contents: read

jobs:
  validate-site-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate the unchanged public jobs feed
        run: python scripts/validate_job_update.py jobs.csv

      - name: Run browser link-policy regression tests
        run: node --test tests/job-link-policy.test.js

      - name: Run locale and activity-time regression tests
        run: node --test tests/locale.test.js tests/activities.test.js tests/articles.test.js
