<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Next Step — Maya’s Journey (Editorial Line Edition)</title>
  <style>
    :root {
      --color-bg: #fffaf5;
      --color-surface: #ffffff;
      --color-surface-warm: #fff6ee;
      --color-tint: #ffe0c3;
      --color-tint-soft: #fff1e5;
      --color-accent: #f79549;
      --color-accent-hover: #f08434;
      --color-accent-deep: #9d3b0e;
      --color-success: #216445;
      --color-success-bg: #eef8f1;
      --color-text: #17191d;
      --color-text-secondary: #4c5561;
      --color-text-muted: #606773;
      --color-border: #dccbc0;
      --color-border-subtle: #f0e5dc;
      --color-focus: #005fcc;
      --ink: #361e10;
      --ink-soft: #6f5646;
      --shadow-film: 0 24px 64px -22px rgb(54 30 16 / 16%), 0 6px 20px -8px rgb(54 30 16 / 7%);
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 24px);
    }

    /* Clean Embed-Ready Video Container */
    .film-embed {
      width: min(100%, 1120px);
      position: relative;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 22px;
      box-shadow: var(--shadow-film);
      overflow: hidden;
      user-select: none;
    }

    .film-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--color-bg);
      overflow: hidden;
      cursor: pointer;
    }

    .film-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Editorial Ink Line Hierarchy */
    .ink-hero {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ink-mid {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ink-fine {
      fill: none;
      stroke: var(--ink-soft);
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ink-warm {
      fill: none;
      stroke: var(--color-accent-deep);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Subtle Corner Brand Watermark */
    .film-watermark {
      position: absolute;
      top: 16px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 12px 6px 7px;
      border-radius: 999px;
      background: rgb(255 250 245 / 86%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgb(220 203 192 / 78%);
      pointer-events: none;
    }

    .film-watermark svg {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: block;
    }

    .film-watermark span {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--color-text);
    }

    /* Cinema Subtitle Lower-Third */
    .subtitle-band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 48px;
      display: flex;
      justify-content: center;
      padding: 0 24px;
      pointer-events: none;
      transition: bottom 240ms ease;
    }

    .film-embed.controls-hidden .subtitle-band {
      bottom: 22px;
    }

    .subtitle-pill {
      max-width: 780px;
      padding: 11px 22px;
      border-radius: 14px;
      background: rgb(255 255 255 / 93%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgb(220 203 192 / 90%);
      box-shadow: 0 8px 24px rgb(54 30 16 / 9%);
      text-align: center;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    .subtitle-pill.is-empty {
      opacity: 0;
      transform: translateY(4px);
    }

    .subtitle-text {
      margin: 0;
      font-size: clamp(0.9rem, 1.42vw, 1.06rem);
      font-weight: 560;
      line-height: 1.44;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }

    /* Center Play / Watch-Again Overlay */
    .center-play-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgb(255 250 245 / 16%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .center-play-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .center-play-overlay.is-ended {
      align-items: end;
      padding-bottom: 50px;
      background: transparent;
    }

    .center-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .center-play-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1px solid var(--color-accent-hover);
      background: var(--color-accent);
      color: #111113;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 12px 32px rgb(157 59 14 / 22%);
      transition: transform 140ms ease, background-color 140ms ease;
    }

    .center-play-btn:hover {
      background: var(--color-accent-hover);
      transform: scale(1.03);
    }

    .center-wide-btn {
      display: none;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: rgb(255 250 245 / 92%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--color-text);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgb(54 30 16 / 12%);
      transition: transform 140ms ease, background-color 140ms ease, border-color 140ms ease;
    }

    .center-wide-btn:hover {
      background: var(--color-surface);
      border-color: var(--color-accent-deep);
      transform: scale(1.02);
    }

    .center-wide-btn:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    /* Minimal Video-Player Bar */
    .video-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(to top, rgb(255 250 245 / 96%), rgb(255 250 245 / 82%) 72%, transparent);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .film-embed.controls-hidden .video-bar {
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .icon-btn:hover {
      background: var(--color-surface-warm);
      border-color: var(--color-border);
    }

    .icon-btn:focus-visible,
    .video-scrub:focus-visible,
    .center-play-btn:focus-visible {
      outline: 2px solid var(--color-focus);
      outline-offset: 2px;
    }

    .video-scrub {
      flex: 1;
      height: 5px;
      margin: 0 4px;
      border-radius: 999px;
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(
        to right,
        var(--color-accent) 0%,
        var(--color-accent) var(--progress, 0%),
        rgb(220 203 192 / 78%) var(--progress, 0%),
        rgb(220 203 192 / 78%) 100%
      );
      cursor: pointer;
    }

    .video-scrub::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--color-accent-deep);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgb(54 30 16 / 28%);
    }

    .video-scrub::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--color-accent-deep);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgb(54 30 16 / 28%);
    }

    .video-time {
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-text-muted);
      min-width: 78px;
      text-align: right;
    }

    @media (max-width: 720px) {
      .film-embed {
        border-radius: 16px;
      }
      .film-watermark {
        top: 10px;
        left: 10px;
        padding: 4px 10px 4px 5px;
      }
      .film-watermark span {
        font-size: 0.72rem;
      }
      .subtitle-band {
        position: static;
        padding: 12px 14px 4px;
        background: var(--color-surface);
        border-top: 1px solid var(--color-border-subtle);
      }
      .film-embed.controls-hidden .subtitle-band {
        bottom: auto;
      }
      .subtitle-pill {
        padding: 4px 6px;
        border: 0;
        box-shadow: none;
        background: transparent;
      }
      .subtitle-text {
        font-size: 0.94rem;
      }
      .video-bar {
        position: static;
        background: var(--color-surface);
        padding: 8px 12px 12px;
        opacity: 1 !important;
        transform: none !important;
        pointer-events: auto !important;
      }
      .icon-btn {
        min-width: 44px;
        min-height: 44px;
      }
      .center-play-overlay.is-ended {
        padding-bottom: 12px;
      }
    }

    @media (max-width: 720px) and (orientation: portrait) {
      .film-embed:not(.is-rotated-wide) .center-wide-btn {
        display: inline-flex;
      }
      .film-embed .center-play-overlay.is-ended .center-wide-btn {
        display: none;
      }
    }

    /* Native Fullscreen & Physical Mobile Landscape */
    .film-embed:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border: 0;
      border-radius: 0;
      background: #1a1512;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
    }

    .film-embed:fullscreen .film-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      aspect-ratio: 16 / 9;
    }

    @media (max-height: 540px) and (orientation: landscape) {
      body {
        padding: 0;
        min-height: 100dvh;
        background: #1a1512;
      }
      .film-embed {
        width: min(100vw, calc(100dvh * 16 / 9));
        max-width: none;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .film-watermark {
        top: 8px;
        left: 10px;
        padding: 4px 10px 4px 5px;
      }
      .film-watermark span {
        font-size: 0.72rem;
      }
      .subtitle-band {
        bottom: 42px;
        padding: 0 18px;
      }
      .film-embed.controls-hidden .subtitle-band {
        bottom: 14px;
      }
      .subtitle-pill {
        max-width: min(90%, 660px);
        padding: 6px 14px;
        border-radius: 10px;
      }
      .subtitle-text {
        font-size: clamp(0.76rem, 2.3dvh, 0.92rem);
        line-height: 1.34;
      }
      .video-bar {
        padding: 6px 12px;
      }
      .icon-btn {
        min-width: 34px;
        height: 32px;
      }
      .center-play-overlay.is-ended {
        padding-bottom: 38px;
      }
    }

    /* CSS Rotated Wide View Fallback (iOS Safari / Restricted Embeds in Portrait) */
    body.is-wide-open {
      overflow: hidden;
      background: #1a1512;
      touch-action: none;
    }

    .film-embed.is-rotated-wide {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(100dvh, calc(100dvw * 16 / 9));
      height: min(100dvw, calc(100dvh * 9 / 16));
      max-width: none;
      margin: 0;
      border: 0;
      border-radius: 0;
      box-shadow: 0 0 0 100vmax #1a1512;
      transform: translate(-50%, -50%) rotate(90deg);
      z-index: 9999;
    }

    .film-embed.is-rotated-wide .film-stage {
      width: 100%;
      height: 100%;
    }

    .film-embed.is-rotated-wide .subtitle-band {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 42px;
      padding: 0 18px;
      background: transparent;
      border-top: 0;
    }

    .film-embed.is-rotated-wide.controls-hidden .subtitle-band {
      bottom: 14px;
    }

    .film-embed.is-rotated-wide .subtitle-pill {
      max-width: min(90%, 660px);
      padding: 6px 14px;
      border-radius: 10px;
      background: rgb(255 255 255 / 93%);
      border: 1px solid rgb(220 203 192 / 90%);
      box-shadow: 0 6px 18px rgb(54 30 16 / 10%);
    }

    .film-embed.is-rotated-wide .subtitle-text {
      font-size: clamp(0.76rem, 2.3vw, 0.92rem);
      line-height: 1.34;
    }

    .film-embed.is-rotated-wide .video-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 6px 12px;
      background: linear-gradient(to top, rgb(255 250 245 / 96%), rgb(255 250 245 / 82%) 72%, transparent);
    }

    .film-embed.is-rotated-wide.controls-hidden .video-bar {
      opacity: 0 !important;
      transform: translateY(6px) !important;
      pointer-events: none !important;
    }

    .film-embed.is-rotated-wide .icon-btn {
      min-width: 36px;
      min-height: 36px;
      height: 36px;
    }

    .film-embed.is-rotated-wide .center-play-overlay.is-ended {
      padding-bottom: 38px;
    }
  </style>
</head>
<body>
  <article class="film-embed" id="filmEmbed" aria-label="My Next Step — Maya’s Journey">
    <div class="film-stage" id="filmStage">
      <svg id="filmSvg" class="film-svg" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="filmTitle filmDesc">
        <title id="filmTitle">My Next Step — Maya’s Journey (Editorial Line Edition)</title>
        <desc id="filmDesc">A two-minute silent short film told through editorial monoline art, cinematic close viewpoints, ambient loops, and My Next Step UI sequences — following Maya from blank forms to walking forward with steady confidence.</desc>

        <defs>
          <linearGradient id="bgWarm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffaf5"/>
            <stop offset="100%" stop-color="#fff4ea"/>
          </linearGradient>
          <linearGradient id="duskWash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#edf2f7" stop-opacity="0.82"/>
            <stop offset="60%" stop-color="#f7efe7" stop-opacity="0.76"/>
            <stop offset="100%" stop-color="#ffe5cd" stop-opacity="0.88"/>
          </linearGradient>
          <linearGradient id="amberWash" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe0c3" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#fffaf5" stop-opacity="0.04"/>
          </linearGradient>
          <linearGradient id="lampCone" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#fbab6b" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="#fffaf5" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="morningWash" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff4e4"/>
            <stop offset="65%" stop-color="#ffe5ca"/>
            <stop offset="100%" stop-color="#fffaf5"/>
          </linearGradient>
          <radialGradient id="bokehGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe3b5" stop-opacity="0.88"/>
            <stop offset="48%" stop-color="#f79549" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#f79549" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="haloWarm" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe0c3" stop-opacity="0.68"/>
            <stop offset="100%" stop-color="#ffe0c3" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="needleLight" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffab47"/>
            <stop offset="1" stop-color="#ffdd95"/>
          </linearGradient>
          <linearGradient id="needleDark" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#9d3b0e"/>
            <stop offset="1" stop-color="#e8782c"/>
          </linearGradient>
          <filter id="cardShadow" x="-10%" y="-10%" width="124%" height="130%">
            <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#361e10" flood-opacity="0.09"/>
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#361e10" flood-opacity="0.05"/>
          </filter>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="20"/>
          </filter>
          <clipPath id="draftClip">
            <rect id="draftClipRect" x="0" y="-22" width="0" height="220"/>
          </clipPath>
          <clipPath id="s1WinClip">
            <rect x="64" y="54" width="380" height="330" rx="12"/>
          </clipPath>
          <clipPath id="s2RainClip">
            <path d="M 32 346 L 32 132 Q 134 62 236 132 L 236 346 Z"/>
          </clipPath>
          <clipPath id="busWinClip">
            <rect x="76" y="74" width="608" height="392" rx="22"/>
          </clipPath>
        </defs>

        <!-- Base Canvas -->
        <rect width="1200" height="675" fill="url(#bgWarm)"/>

        <!-- =================================================================
             SHOT 1 (0.0s - 14.5s): REAL LIFE — Over-the-Shoulder Dusk Study Desk
             Monoline editorial drawing + rain loop + pose crossfade to phone
             ================================================================= -->
        <g id="shot1">
          <g id="shot1Camera">
            <!-- Quiet Warm Paper Ground + Translucent Dusk Wash -->
            <rect x="0" y="0" width="1200" height="675" fill="url(#bgWarm)"/>
            <rect x="0" y="458" width="1200" height="217" fill="#fff3e6" opacity="0.7"/>

            <!-- Tall French Window Panes + Soft Rooftop Contour + Continuous Rain Loop -->
            <rect x="64" y="54" width="380" height="330" rx="12" fill="url(#duskWash)"/>
            <g clip-path="url(#s1WinClip)">
              <!-- Clean architectural rooflines rendered as minimalist editorial ink over wash -->
              <path d="M 48 384 L 48 298 L 116 264 L 182 298 L 182 384 M 182 290 L 254 252 L 328 290 L 328 384 M 328 310 L 392 282 L 460 310" fill="#efe4da" fill-opacity="0.65" stroke="#8a7262" stroke-width="1.4" stroke-linejoin="round"/>
              <!-- Warm distant window lights -->
              <rect x="218" y="294" width="12" height="16" rx="1.5" fill="#ffe0c3" stroke="#9d3b0e" stroke-width="0.9" opacity="0.8"/>
              <rect x="274" y="308" width="12" height="16" rx="1.5" fill="#ffe0c3" stroke="#9d3b0e" stroke-width="0.9" opacity="0.68"/>
              <!-- Smooth Infinite Rain Streaks Loop -->
              <g id="s1RainLoop" stroke="#7d90a5" stroke-width="1.5" stroke-linecap="round" opacity="0.58">
                <line x1="112" y1="30" x2="92" y2="86"/>
                <line x1="198" y1="-20" x2="178" y2="36"/>
                <line x1="286" y1="60" x2="266" y2="116"/>
                <line x1="364" y1="10" x2="344" y2="66"/>
                <line x1="146" y1="180" x2="126" y2="236"/>
                <line x1="242" y1="150" x2="222" y2="206"/>
                <line x1="340" y1="196" x2="320" y2="252"/>
                <line x1="418" y1="130" x2="398" y2="186"/>
                <line x1="94" y1="280" x2="74" y2="336"/>
                <line x1="280" y1="310" x2="260" y2="366"/>
              </g>
            </g>
            <!-- Crisp Monoline Window Frame & Sill -->
            <rect x="64" y="54" width="380" height="330" rx="12" class="ink-mid"/>
            <line x1="254" y1="54" x2="254" y2="384" class="ink-fine"/>
            <line x1="64" y1="218" x2="444" y2="218" class="ink-fine"/>
            <path d="M 52 384 L 456 384 L 456 396 L 52 396 Z" fill="#fff6ee" stroke="#361e10" stroke-width="1.6"/>

            <!-- Architect Cantilever Desk Lamp Casting Soft Amber Wash (Clear Right Margin) -->
            <polygon points="984,278 1044,278 1168,458 848,458" fill="url(#lampCone)"/>
            <g transform="translate(1012, 224)">
              <path d="M 18 234 L 78 234" class="ink-hero"/>
              <path d="M 48 234 L 68 124 L 14 40" class="ink-mid"/>
              <circle cx="68" cy="124" r="4" fill="#fffaf5" stroke="#361e10" stroke-width="1.8"/>
              <path d="M -20 46 L 20 24 L 40 58 L -6 64 Z" fill="#ffe0c3" stroke="#361e10" stroke-width="2" stroke-linejoin="round"/>
            </g>

            <!-- Clean Monoline Desk Horizon Line & Legs -->
            <line x1="80" y1="458" x2="1120" y2="458" class="ink-hero"/>
            <line x1="126" y1="458" x2="126" y2="610" class="ink-mid"/>
            <line x1="1074" y1="458" x2="1074" y2="610" class="ink-mid"/>

            <!-- Blank Application Sheet — Crisp UI Focus Right of Frame -->
            <g filter="url(#cardShadow)" transform="translate(490, 192)">
              <rect width="414" height="248" rx="18" fill="#ffffff" stroke="#dccbc0" stroke-width="1.5"/>
              <text x="28" y="40" font-size="11.5" font-weight="750" letter-spacing="0.06em" fill="#606773">APPLICATION FORM</text>
              <text x="28" y="72" font-size="20" font-weight="750" fill="#17191d">Tell us about your experience</text>

      const setVis = (el, opacity, transform) => {
        el.style.opacity = opacity.toFixed(3);
        if (transform !== undefined) el.setAttribute("transform", transform);
      };

      const pathLenCache = new WeakMap();
      function drawStroke(el, progress) {
        if (!el || typeof el.getTotalLength !== "function") return;
        let len = pathLenCache.get(el);
        if (!len) {
          len = Math.ceil(el.getTotalLength());
          pathLenCache.set(el, len);
          el.setAttribute("stroke-dasharray", len);
        }
        el.setAttribute("stroke-dashoffset", (len * (1 - clamp(progress))).toFixed(1));
      }

      function wavePath(amp, phase, yBase, invert = false) {
        const sign = invert ? -1 : 1;
        const pts = [];
        for (let x = 42; x <= 540; x += 14) {
          const u = (x - 42) / (540 - 42);
          const env = Math.sin(u * Math.PI);
          const y = yBase + sign * Math.sin(u * Math.PI * 4 + phase) * amp * env;
          pts.push(`${x === 42 ? "M" : "L"} ${x} ${y.toFixed(1)}`);
        }
        return pts.join(" ");
      }

      let t = prefersReducedMotion ? 34.0 : 0.0;
      let playing = !prefersReducedMotion;
      let lastMs = null;
      let lastSub = null;
      let hideTimer = null;

      function render(time) {
        t = clamp(time, 0, DURATION);

        // SHOT 1: Over-the-Shoulder Dusk Desk — Loop Rain/Steam + Stepped Pose Transition (0.0s -> 14.5s)
        const s1 = shotWindow(t, 0.0, 0.7, 13.5, 14.5);
        setVis(els.shot1, s1);
        if (s1 > 0.005) {
          const zoom = lerp(1.0, 1.045, win(t, 0, 13.8, (x) => clamp(x)));
          const cx = 600 * (1 - zoom);
          const cy = 337.5 * (1 - zoom);
          els.shot1Camera.setAttribute("transform", `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) scale(${zoom.toFixed(4)})`);

          // Continuous rain falling loop across window panes
          const rainLoop = (t * 0.42) % 1;
          els.s1RainLoop.setAttribute("transform", `translate(${(-rainLoop * 24).toFixed(1)}, ${(rainLoop * 68).toFixed(1)})`);

          // Ambient tea steam drift loop
          const st = Math.sin(t * 1.45) * 2.5;
          els.mugSteam1.setAttribute("transform", `translate(${st.toFixed(1)}, ${(-Math.abs(st)).toFixed(1)})`);
          els.mugSteam2.setAttribute("transform", `translate(${(-st).toFixed(1)}, ${(-Math.abs(st) * 0.8).toFixed(1)})`);

          // Clean Pose A -> Pose B dissolve (turns gently toward lit phone)
          const poseMix = win(t, 9.4, 11.4);
          els.s1PoseA.style.opacity = (1 - poseMix).toFixed(3);
          els.s1PoseB.style.opacity = poseMix.toFixed(3);

          // Looping concentric light ripples around phone once awake
          const phoneAwake = win(t, 9.4, 11.2);
          els.s1PhoneGlow.style.opacity = lerp(0.28, 1.0, phoneAwake).toFixed(3);
          const p1 = (t * 0.55) % 1;
          const p2 = (t * 0.55 + 0.5) % 1;
          els.s1Pulse1.setAttribute("r", lerp(14, 48, p1).toFixed(1));
          els.s1Pulse1.style.opacity = (phoneAwake * (1 - p1) * 0.7).toFixed(3);
          els.s1Pulse2.setAttribute("r", lerp(14, 48, p2).toFixed(1));
          els.s1Pulse2.style.opacity = (phoneAwake * (1 - p2) * 0.5).toFixed(3);
        }

        // SHOT 2: Story Catcher <-> Editorial Community Hall (13.7s -> 28.5s)
        const s2 = shotWindow(t, 13.7, 14.7, 27.4, 28.5);
        setVis(els.shot2, s2);
        if (s2 > 0.005) {
          const pIn = win(t, 13.7, 15.1);
          els.shot2Prompt.setAttribute("transform", `translate(${lerp(54, 82, pIn).toFixed(1)}, 108)`);
          els.shot2Reply.style.opacity = win(t, 17.5, 19.0).toFixed(3);
          els.shot2Thread.style.opacity = win(t, 19.2, 20.2).toFixed(3);

          const memIn = win(t, 19.6, 21.4);
          setVis(els.shot2MemoryScene, memIn, `translate(${lerp(572, 540, memIn).toFixed(1)}, 84)`);
          // Self-drawing architectural arch & welcoming hand stroke + endless rain loop
          drawStroke(els.s2ArchDraw, win(t, 19.8, 22.0));
          drawStroke(els.s2WelcomeArm, win(t, 21.2, 23.0));
          const s2Rain = (t * 0.65) % 1;
          els.s2RainLoop.setAttribute("transform", `translate(${(-s2Rain * 20).toFixed(1)}, ${(s2Rain * 64).toFixed(1)})`);
        }

        // SHOT 3: Story Card Unfolds (27.6s -> 41.5s)
        const s3 = shotWindow(t, 27.6, 28.7, 40.4, 41.5);
        setVis(els.shot3, s3);
        if (s3 > 0.005) {
          const dock = win(t, 40.2, 41.5);
          const sc = lerp(0.95, 1.0, win(t, 27.6, 29.1)) * lerp(1.0, 0.88, dock);
          const x = lerp(290, 94, dock) + (1 - sc) * 310 * (1 - dock);
          const y = lerp(82, 84, dock);
          els.shot3Card.setAttribute("transform", `translate(${x.toFixed(1)}, ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);

          els.shot3Spine.setAttribute("stroke-dashoffset", lerp(200, 0, win(t, 29.0, 33.8)).toFixed(1));
          els.s3Node1.style.opacity = win(t, 29.2, 30.4).toFixed(3);
          els.s3Node2.style.opacity = win(t, 31.0, 32.2).toFixed(3);
          els.s3Node3.style.opacity = win(t, 32.8, 34.0).toFixed(3);
          els.s3Pills.style.opacity = win(t, 34.4, 35.8).toFixed(3);
        }

        // SHOT 4: Maya's Profile + Six Skills (40.6s -> 54.5s)
        const s4 = shotWindow(t, 40.6, 41.6, 53.4, 54.5);
        setVis(els.shot4, s4);
        if (s4 > 0.005) {
          const enter = win(t, 40.6, 42.0);
          els.shot4Left.setAttribute("transform", `translate(${lerp(130, 94, enter).toFixed(1)}, 84)`);
          els.shot4Right.setAttribute("transform", `translate(${lerp(754, 714, enter).toFixed(1)}, 84)`);
          ["s4Wire1", "s4Wire2", "s4Wire3", "s4Wire4"].forEach((id, idx) => {
            const wire = document.getElementById(id);
            const local = win(t, 42.5 + idx * 0.65, 44.0 + idx * 0.65);
            wire.setAttribute("stroke-dasharray", 140);
            wire.setAttribute("stroke-dashoffset", lerp(140, 0, local).toFixed(1));
          });
          for (let i = 1; i <= 6; i++) {
            const row = document.getElementById("s4Row" + i);
            row.style.opacity = win(t, 42.4 + i * 0.55, 43.6 + i * 0.55).toFixed(3);

        // SHOT 5: Over-the-Shoulder Bus Window Parallax Loop -> Opportunities (53.6s -> 68.5s)
        const s5 = shotWindow(t, 53.6, 54.7, 67.4, 68.5);
        setVis(els.shot5, s5);
        if (s5 > 0.005) {
          const shiftOut = win(t, 59.5, 61.3);

          els.transitSkyline.setAttribute("transform", `translate(${loopSky.toFixed(1)}, 0)`);

          setVis(els.shot5RealLife, 1 - shiftOut * 0.92, `translate(${lerp(220, -140, shiftOut).toFixed(1)}, 0)`);

          const oppIn = win(t, 59.8, 61.6);
          const oppShiftX = lerp(120, -180, oppIn);
          els.shot5Opps.setAttribute("transform", `translate(${oppShiftX.toFixed(1)}, 0)`);

          const selectP = win(t, 63.4, 65.2);
          els.s5Card1.style.opacity = (win(t, 60.0, 61.0) * (1 - selectP * 0.48)).toFixed(3);
          els.s5Card2.style.opacity = win(t, 60.2, 61.2).toFixed(3);
          els.s5Card2.setAttribute("transform", `translate(460, 224) scale(${lerp(1, 1.025, selectP).toFixed(3)})`);
          els.s5Card3.style.opacity = (win(t, 60.4, 61.4) * (1 - selectP * 0.48)).toFixed(3);
        }

        // SHOT 6: Opportunity Match & Memory Discovery (67.6s -> 84.5s)
        const s6 = shotWindow(t, 67.6, 68.7, 83.4, 84.5);
        setVis(els.shot6, s6);
        if (s6 > 0.005) {
          const enter = win(t, 67.6, 69.0);
          els.shot6Left.setAttribute("transform", `translate(${lerp(48, 86, enter).toFixed(1)}, 86)`);
          els.shot6Right.setAttribute("transform", `translate(${lerp(738, 700, enter).toFixed(1)}, 86)`);

          const w1 = win(t, 69.8, 71.8);
          const w2 = win(t, 71.4, 73.4);
          els.s6Wire1.setAttribute("stroke-dasharray", 260);
          els.s6Wire1.setAttribute("stroke-dashoffset", lerp(260, 0, w1).toFixed(1));
          els.s6Wire2.setAttribute("stroke-dasharray", 260);
          els.s6Wire2.setAttribute("stroke-dashoffset", lerp(260, 0, w2).toFixed(1));

          const addP = win(t, 75.8, 77.6, easeOutBack);
          setVis(els.s6AddedCard, win(t, 75.8, 77.0), `translate(20, ${lerp(320, 290, clamp(addP)).toFixed(1)})`);

          const w3 = win(t, 77.6, 79.4);
          els.s6Wire3.setAttribute("stroke-dasharray", 260);
          els.s6Wire3.setAttribute("stroke-dashoffset", lerp(260, 0, w3).toFixed(1));

          const resolved = win(t, 78.8, 79.8);
          els.s6Req3Open.style.opacity = (1 - resolved).toFixed(3);
          els.s6Req3Done.style.opacity = resolved.toFixed(3);
          els.s6Req3Box.setAttribute("stroke", resolved > 0.5 ? "#d7efdf" : "#f79549");
          els.s6Req3Dot.setAttribute("fill", resolved > 0.5 ? "#216445" : "#f79549");
          els.s6Req3Pill.setAttribute("fill", resolved > 0.5 ? "#eef8f1" : "#fff1e5");
          els.s6Req3PillTxt.setAttribute("fill", resolved > 0.5 ? "#216445" : "#9d3b0e");
          els.s6Req3PillTxt.textContent = resolved > 0.5 ? "Evidence matched" : "Spot & add real evidence";

        // SHOT 7: Macro Hands-on-Laptop Cut -> Application Draft & Submit (83.6s -> 96.8s)
        const s7 = shotWindow(t, 83.6, 84.5, 95.7, 96.8);
        setVis(els.shot7, s7);
        if (s7 > 0.005) {
          const deskOut = win(t, 86.8, 88.0);
          setVis(els.shot7RealLife, 1 - deskOut);
          const tapL = Math.sin(t * 7.2) * 1.4;
          const tapR = Math.cos(t * 7.2) * 1.4;
          els.s7HandL.setAttribute("transform", `translate(0, ${tapL.toFixed(1)})`);
          els.s7HandR.setAttribute("transform", `translate(0, ${tapR.toFixed(1)})`);
          els.s7Steam.setAttribute("transform", `translate(${(Math.sin(t * 1.5) * 2.2).toFixed(1)}, ${(-Math.abs(Math.sin(t * 1.5) * 2)).toFixed(1)})`);

          const appIn = win(t, 87.0, 88.3);
          setVis(els.shot7App, appIn);
          els.shot7Left.setAttribute("transform", `translate(${lerp(56, 92, appIn).toFixed(1)}, 92)`);
          els.shot7Right.setAttribute("transform", `translate(${lerp(584, 548, appIn).toFixed(1)}, 92)`);

          els.s7Chip1.style.opacity = win(t, 88.2, 89.2).toFixed(3);
          els.s7Chip2.style.opacity = win(t, 89.0, 90.0).toFixed(3);
          els.s7Arc.style.opacity = win(t, 89.5, 90.4).toFixed(3);

          const writeP = win(t, 90.3, 94.4, (x) => clamp(x));
          els.draftClipRect.setAttribute("width", lerp(0, 485, writeP).toFixed(1));
          const lineIdx = Math.min(5, Math.floor(writeP * 6));
          const lineFrac = (writeP * 6) % 1;
          const cursorY = 96 + (lineIdx === 0 ? 0 : 14 + lineIdx * 28);
          const cursorX = 42 + lineFrac * 400;
          els.s7Cursor.setAttribute("x", cursorX.toFixed(1));
          els.s7Cursor.setAttribute("y", cursorY.toFixed(1));
          els.s7Cursor.style.opacity = (writeP > 0.02 && writeP < 0.98) ? "1" : "0";
          els.s7Stamp.style.opacity = win(t, 94.2, 95.3).toFixed(3);
        }

        // SHOT 7B: Interview Invitation — Over-the-Shoulder Joy & Breath Ripples (96.0s -> 104.2s)
        const sInt = shotWindow(t, 96.0, 97.1, 103.2, 104.2);
        setVis(els.shotInterview, sInt);
        if (sInt > 0.005) {
          const intIn = win(t, 96.0, 97.4);
          els.shotIntLeft.setAttribute("transform", `translate(${lerp(54, 88, intIn).toFixed(1)}, 92)`);
          els.shotIntRight.setAttribute("transform", `translate(${lerp(700, 664, intIn).toFixed(1)}, 92)`);
          els.sIntBadge.style.opacity = win(t, 97.2, 98.4).toFixed(3);

          const breathRise = Math.sin(clamp((t - 97.0) * 1.3, 0, Math.PI * 2)) * 2.4;
          els.sIntMaya.setAttribute("transform", `translate(148, ${(108 - breathRise).toFixed(1)})`);
          els.sIntGlow1.style.opacity = (0.35 + 0.65 * Math.sin(t * 3.1)).toFixed(2);
          els.sIntGlow2.style.opacity = (0.30 + 0.65 * Math.sin(t * 3.1 - 0.8)).toFixed(2);
          els.sIntGlow3.style.opacity = (0.25 + 0.60 * Math.sin(t * 3.1 - 1.6)).toFixed(2);
        }

        // SHOT 8: Interview Practice <-> Calm Room Rehearsal & Resonance Loop (103.4s -> 112.4s)
        const s8 = shotWindow(t, 103.4, 104.4, 111.4, 112.4);
        setVis(els.shot8, s8);
        if (s8 > 0.005) {
          const enter = win(t, 103.4, 104.7);
          els.shot8Left.setAttribute("transform", `translate(${lerp(54, 88, enter).toFixed(1)}, 92)`);
          els.shot8Right.setAttribute("transform", `translate(${lerp(740, 706, enter).toFixed(1)}, 92)`);

          const amp1 = 13 + Math.sin(t * 2.1) * 6;
          const amp2 = 10 + Math.cos(t * 1.8) * 5;
          els.s8Wave1.setAttribute("d", wavePath(amp1, t * 3.6, 256, false));
          els.s8Wave2.setAttribute("d", wavePath(amp2, t * 2.9 + 1.0, 256, true));
          els.s8Tip.style.opacity = win(t, 107.6, 108.9).toFixed(3);

          const breath = Math.sin(t * 1.5) * 2.2;
          els.s8MayaBody.setAttribute("transform", `translate(106, ${(128 - breath).toFixed(1)})`);
          els.s8Plant.setAttribute("transform", `translate(324, 246) rotate(${(Math.sin(t * 1.2) * 1.6).toFixed(2)} 31 62)`);
          els.s8AirArc1.style.opacity = (0.38 + 0.58 * Math.sin(t * 3.0)).toFixed(2);
          els.s8AirArc2.style.opacity = (0.30 + 0.56 * Math.sin(t * 3.0 - 0.7)).toFixed(2);
          els.s8AirArc3.style.opacity = (0.24 + 0.50 * Math.sin(t * 3.0 - 1.4)).toFixed(2);
        }

        // SHOT 9: Camera Dolly Into Self-Drawing Sunlit Reception -> Compass Finale (111.8s -> 120.0s)
        const s9 = win(t, 111.8, 112.8);
        setVis(els.shot9, s9);
        if (s9 > 0.005) {
          const dolly = win(t, 111.8, 116.4);
          const camScale = lerp(1.0, 1.08, dolly);
          const cx = 600 * (1 - camScale);
          const cy = 360 * (1 - camScale);
          els.shot9Doorway.setAttribute("transform", `translate(${cx.toFixed(1)}, ${cy.toFixed(1)}) scale(${camScale.toFixed(4)})`);

          drawStroke(els.s9ArchDraw, win(t, 112.0, 114.6));
          const breeze = Math.sin(t * 1.6) * 2.2;
          els.s9PlantL.setAttribute("transform", `translate(364, 412) rotate(${breeze.toFixed(2)} 34 42)`);
          els.s9PlantR.setAttribute("transform", `translate(768, 412) rotate(${(-breeze).toFixed(2)} 34 42)`);
          els.shot9Maya.setAttribute("transform", `translate(544, ${(386 - dolly * 16).toFixed(1)})`);

          const finP = win(t, 116.0, 117.5);
          els.shot9Finale.style.opacity = finP.toFixed(3);
        }

        // Subtitles & Minimal Video Bar
        let subText = "";
        for (const [a, b, txt] of SUBTITLES) {
          if (t >= a && t <= b) {
            subText = txt;
            break;
          }
        }
        if (subText !== lastSub) {
          lastSub = subText;
          els.subtitleText.textContent = subText;
          els.subtitlePill.classList.toggle("is-empty", !subText);
        }

        const pct = (t / DURATION) * 100;
        els.scrub.value = t.toFixed(2);
        els.scrub.style.setProperty("--progress", `${pct.toFixed(2)}%`);
        els.timeReadout.textContent = `${fmtClock(t)} / ${fmtClock(DURATION)}`;
      }

      function syncPlayState() {
        const ended = t >= DURATION - 0.05;
        els.playBtn.textContent = playing ? "❚❚" : "▶";
        els.playBtn.setAttribute("aria-label", playing ? "Pause film" : (ended ? "Replay film" : "Play film"));

        const showCenter = !playing;
        els.centerOverlay.classList.toggle("is-visible", showCenter);
        els.centerOverlay.classList.toggle("is-ended", ended);
        els.centerPlayIcon.textContent = ended ? "↺" : "▶";
        els.centerPlayLabel.textContent = ended ? "Watch again" : (t < 0.5 ? "Play film" : "Resume");
      }

      function scheduleHideControls() {
        clearTimeout(hideTimer);
        els.filmEmbed.classList.remove("controls-hidden");
        if (playing) {
          hideTimer = setTimeout(() => {
            if (playing) els.filmEmbed.classList.add("controls-hidden");
          }, 2200);
        }
      }

      function togglePlay() {
        if (!playing && t >= DURATION - 0.05) {
          t = 0;
        }
        playing = !playing;
        lastMs = null;
        syncPlayState();
        scheduleHideControls();
      }

      function tick(now) {
        if (lastMs !== null && playing) {
          t += Math.min(0.1, (now - lastMs) / 1000);
          if (t >= DURATION) {
            t = DURATION;
            playing = false;
            syncPlayState();
            scheduleHideControls();
          }
          render(t);
        }
        lastMs = now;
        requestAnimationFrame(tick);
      }

      els.playBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePlay();
      });

      els.centerPlayBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        togglePlay();
      });

      els.filmStage.addEventListener("click", () => {
        togglePlay();
      });

      els.replayBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        t = 0;
        playing = !prefersReducedMotion;
        lastMs = null;
        render(0);
        syncPlayState();
        scheduleHideControls();
      });

      els.scrub.addEventListener("input", (e) => {
        t = parseFloat(e.target.value);
        render(t);
        syncPlayState();
        scheduleHideControls();
      });

      let isRotatedWide = false;

      function syncWideButton() {
        const isNativeFs = document.fullscreenElement === els.filmEmbed;
        const active = isNativeFs || isRotatedWide;
        els.fullscreenBtn.textContent = active ? "✕" : "⛶";
        els.fullscreenBtn.setAttribute("aria-label", active ? "Exit wide view" : "Enter wide / full screen");
        els.fullscreenBtn.setAttribute("title", active ? "Exit wide view" : "Wide / full screen");
      }

      function setRotatedWide(next) {
        isRotatedWide = Boolean(next);
        els.filmEmbed.classList.toggle("is-rotated-wide", isRotatedWide);
        document.body.classList.toggle("is-wide-open", isRotatedWide);
        syncWideButton();
        scheduleHideControls();
      }

      async function enterWideView() {
        const isPortraitPhone = window.innerHeight > window.innerWidth && window.innerWidth <= 720;

        if (els.filmEmbed.requestFullscreen) {
          try {
            await els.filmEmbed.requestFullscreen();
            if (isPortraitPhone && screen.orientation && typeof screen.orientation.lock === "function") {
              try {
                await screen.orientation.lock("landscape");
              } catch (_) {
                if (window.innerHeight > window.innerWidth) {
                  if (document.fullscreenElement) await document.exitFullscreen();
                  setRotatedWide(true);
                  return;
                }
              }
            } else if (isPortraitPhone && window.innerHeight > window.innerWidth) {
              if (document.fullscreenElement) await document.exitFullscreen();
              setRotatedWide(true);
              return;
            }
            syncWideButton();
            return;
          } catch (_) {
            // Fall through to CSS rotated wide-view fallback
          }
        }

        if (window.innerHeight > window.innerWidth) {
          setRotatedWide(true);
        }
      }

      async function exitWideView() {
        if (isRotatedWide) {
          setRotatedWide(false);
        }
        if (document.fullscreenElement === els.filmEmbed && document.exitFullscreen) {
          try {
            await document.exitFullscreen();
          } catch (_) {}
        }
        try {
          if (screen.orientation && typeof screen.orientation.unlock === "function") {
            screen.orientation.unlock();
          }
        } catch (_) {}
        syncWideButton();
      }

      async function toggleWideView() {
        if (document.fullscreenElement === els.filmEmbed || isRotatedWide) {
          await exitWideView();
        } else {
          await enterWideView();
        }
      }

      els.fullscreenBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleWideView();
      });

      els.wideViewBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!playing) {
          if (t >= DURATION - 0.05) t = 0;
          playing = !prefersReducedMotion;
          lastMs = null;
          render(t);
          syncPlayState();
        }
        await enterWideView();
        scheduleHideControls();
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          try {
            if (screen.orientation && typeof screen.orientation.unlock === "function") {
              screen.orientation.unlock();
            }
          } catch (_) {}
        }
        syncWideButton();
      });

      window.addEventListener("resize", () => {
        if (isRotatedWide && window.innerWidth > window.innerHeight) {
          setRotatedWide(false);
        }
      });

      ["mousemove", "focusin", "touchstart"].forEach((evt) => {
        els.filmEmbed.addEventListener(evt, scheduleHideControls, { passive: true });
      });

      document.addEventListener("keydown", (e) => {
        if (e.code === "Escape" && isRotatedWide) {
          e.preventDefault();
          exitWideView();
        } else if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        } else if (e.code === "ArrowLeft") {
          e.preventDefault();
          t = clamp(t - 5, 0, DURATION);
          render(t);
          scheduleHideControls();
        } else if (e.code === "ArrowRight") {
          e.preventDefault();
          t = clamp(t + 5, 0, DURATION);
          render(t);
          scheduleHideControls();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && playing) {
          playing = false;
          syncPlayState();
          scheduleHideControls();
        }
      });

      render(t);
      syncPlayState();
      syncWideButton();
      scheduleHideControls();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
