media:
  input: media/images
  output: /nottinghamshire-jobs/media/images
  extensions: [jpg, jpeg, png, webp, gif]
  rename: safe
content:
  - name: articles_en
    label: Articles — English
    type: collection
    path: _articles_en
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{hour}-{minute}-{second}.md"
      field: false
    view:
      primary: title
    fields:
      - name: title
        label: Title / 標題
        type: string
        required: true
      - name: summary
        label: Short summary / 簡介
        type: text
      - name: image
        label: Cover image / 封面圖片
        type: image
      - name: image_alt
        label: Image description / 圖片描述
        type: string
      - name: date
        label: Publication date / 發布日期
        type: date
        required: true
        default: ""
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category / 類別
        type: string
      - name: body
        label: Content / 內容
        type: rich-text
